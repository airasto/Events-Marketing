<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pracovný list KORA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Rasťo AI · Kit 1 (červený). Layout: jeden stĺpec na čítanie, lepkavá hlavička s piatimi sedeniami */
  --bg:#FFFFFF; --surface:#F5F5F5; --tint:#FFF5F5; --fg:#333333; --heading:#111111; --muted:#54595F;
  --line:#E4E4E4; --accent:#E60000; --accent-hover:#C80000; --mark:#FFF5F5; --on-accent:#FFFFFF;
  --logo-l:block; --logo-d:none;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111111; --surface:#1A1A1A; --tint:#222222; --fg:#FFFFFF; --heading:#FFFFFF; --muted:#CCCCCC;
  --line:#222222; --mark:#222222; --logo-l:none; --logo-d:block; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111111; --surface:#1A1A1A; --tint:#222222; --fg:#FFFFFF; --heading:#FFFFFF; --muted:#CCCCCC;
  --line:#222222; --mark:#222222; --logo-l:none; --logo-d:block; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;flex-direction:column;gap:6px;padding-block:12px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{height:46px;width:auto;margin-left:-6px}
.logo-l{display:var(--logo-l)} .logo-d{display:var(--logo-d)}
.who{font-size:12px;color:var(--muted);text-align:right;line-height:1.5}
.who b{color:var(--heading);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--on-accent);background:var(--accent);padding:2px 8px;border-radius:3px;margin-bottom:2px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;display:flex;flex-direction:column;padding:8px 12px 10px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;font-size:13px;line-height:1.35}
nav.tabs a b{font-weight:700;color:var(--heading);font-size:13px}
nav.tabs a span{font-size:12px}
nav.tabs a.on{border-bottom-color:var(--accent)}
nav.tabs a.on b{color:var(--accent)}
nav.tabs a.pend b{color:var(--muted);font-weight:600}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:28px 48px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h1{font-size:clamp(28px,5vw,40px);font-weight:800;line-height:1.15;letter-spacing:-1px;color:var(--heading);margin:0 0 10px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--muted);margin:0 0 24px;padding-bottom:18px;border-bottom:2px solid var(--heading)}
.meta b{color:var(--heading);font-weight:600}
h2{font-size:22px;font-weight:700;line-height:1.3;color:var(--heading);margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px}
.lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
p{margin:0 0 10px}
ul,ol{margin:0;padding-left:22px} li{margin:4px 0}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:18px}
.overview > *{min-width:0}
.card{background:var(--surface);border-radius:6px;padding:16px 18px}
.card.tint{background:var(--tint)}
.card p:last-child{margin:0}
.how{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 20px;margin:0 0 26px;padding:0;list-style:none}
.how li{margin:0;padding-left:14px;position:relative}
.how li::before{content:"";position:absolute;left:0;top:.75em;width:6px;height:6px;background:var(--accent);border-radius:50%}
.info{border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin:0 0 8px}
.info h2{font-size:17px;margin-bottom:6px}
.task{padding-block:28px 6px;border-top:1px solid var(--line);margin-top:28px}
.task > header{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.task > header .eyebrow{margin:0}
.why{max-width:68ch}
.steps li::marker,.rules li::marker{color:var(--accent);font-weight:700}
.prompts{display:flex;flex-direction:column;gap:12px;margin:16px 0 4px}
.prompt{margin:0;background:var(--surface);border-left:3px solid var(--accent);border-radius:4px;min-width:0}
.prompt figcaption{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px 0 14px}
.prompt figcaption span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prompt pre{margin:0;padding:8px 14px 14px;font-family:var(--mono);font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--heading)}
.prompt mark{background:var(--mark);color:var(--accent);font-weight:500;border-radius:2px;padding:0 2px}
button{font-family:var(--font);cursor:pointer}
.copy{font-size:12px;font-weight:700;color:var(--on-accent);background:var(--accent);border:0;border-radius:4px;padding:5px 10px;white-space:nowrap}
.copy:hover{background:var(--accent-hover)}
.copy.done{background:var(--heading);color:var(--bg)}
.ghost{font-size:13px;font-weight:700;color:var(--heading);background:transparent;border:1.5px solid var(--heading);border-radius:4px;padding:8px 14px}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.tip{background:var(--tint);border-radius:4px;padding:10px 14px;margin:14px 0 4px;font-size:14px}
.tip b{color:var(--accent);margin-right:6px}
.tbl{overflow-x:auto;margin:14px 0 4px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--heading);border-bottom:2px solid var(--heading);padding:8px 10px;vertical-align:bottom}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:600;color:var(--heading)}
td textarea{min-height:58px}
.fill{display:flex;flex-direction:column;gap:6px;margin:16px 0 4px}
.fill label{font-weight:600;color:var(--heading);font-size:14px}
textarea{width:100%;font-family:var(--font);font-size:14px;line-height:1.6;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-bottom:2px solid var(--muted);border-radius:4px 4px 0 0;padding:8px 10px;resize:vertical}
textarea::placeholder{color:var(--muted);opacity:.7}
.check{list-style:none;padding:0;margin:0}
.check li{margin:6px 0}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:17px;height:17px;margin:4px 0 0;flex:0 0 auto}
.check .other{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;flex:1 1 auto;min-width:0}
.check .other input[type=text]{flex:1 1 220px;min-width:0;font-family:var(--font);font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-bottom:2px solid var(--muted);border-radius:4px 4px 0 0;padding:5px 10px}
.check .other input[type=text]::placeholder{color:var(--muted);opacity:.7}
input[type=text]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.choice{list-style:none;padding:0;margin:0;counter-reset:c}
.choice li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 18px;padding:10px 0;border-bottom:1px solid var(--line);counter-increment:c}
.choice li > span:first-child{flex:1 1 300px;min-width:0}
.choice li > span:first-child::before{content:counter(c) ". ";font-weight:700;color:var(--accent)}
.opts{display:flex;gap:16px}
.opts label{display:flex;gap:6px;align-items:center;font-weight:600;font-size:14px;cursor:pointer}
.opts input{margin:0}
.end{margin-top:36px;padding-top:24px;border-top:2px solid var(--heading)}
.end h2{margin-bottom:6px}
.next{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:6px;padding:14px 18px;margin-top:22px}
.next b{color:var(--heading)}
.notes-out{margin-top:10px}
.notes-box{background:var(--tint);border-radius:6px;padding:18px 20px;margin-top:22px}
.notes-box h2{font-size:18px;margin-bottom:6px}
.copy.big{font-size:14px;padding:10px 16px}
.notes-msg{margin:10px 0 0;font-size:14px;font-weight:600;color:var(--heading)}
.notes-msg:empty{display:none}
.small{font-size:12px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0 4px}
.cols > *{min-width:0}
.cols h4{margin:0 0 6px;font-size:14px;font-weight:700;color:var(--heading)}
.cols ul{padding-left:18px}
.src{font-size:12px;color:var(--muted);margin:12px 0 0}
.srcs{font-size:13px;padding-left:20px}
.srcs a{color:var(--heading);text-decoration-color:var(--accent);overflow-wrap:anywhere}
.pending{border:1.5px dashed var(--line);border-radius:6px;padding:22px}
.pending .lab{color:var(--accent)}
footer{border-top:1px solid var(--line);padding-block:18px 28px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px}
footer b{color:var(--heading)}
/* lektor */
.agenda td{vertical-align:middle}
.agenda .tm{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;font-weight:500}
.agenda .mn{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:400;color:var(--fg)}
.agenda .bl{font-weight:600}
.agenda td:first-child{font-weight:500}
.agenda tr.pause td{background:var(--surface);color:var(--muted)}
.agenda tfoot td{font-weight:700;color:var(--heading);border-bottom:0}
.bar{display:inline-block;width:42px;height:5px;background:var(--line);border-radius:3px;margin-left:8px;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.blk{padding-block:22px 4px;border-top:1px solid var(--line);margin-top:22px}
.blk > header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.blk .bn{font-weight:800;color:var(--accent);font-size:18px;font-variant-numeric:tabular-nums}
.blk h2{font-size:20px;flex:1 1 220px}
.blk .bt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;color:var(--heading);background:var(--surface);border-radius:3px;padding:2px 8px}
blockquote{margin:6px 0 4px;padding:10px 14px;background:var(--tint);border-radius:4px;font-size:16px;font-weight:600;color:var(--heading)}
blockquote small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
dl{margin:0}
dt{font-weight:600;color:var(--heading);margin-top:8px}
dt::before{content:"Ona: ";color:var(--muted);font-weight:500}
dd{margin:2px 0 0}
dd::before{content:"Ty: ";color:var(--accent);font-weight:700}
.short{font-size:14px;margin-top:12px}
.short b{color:var(--accent)}
.risk td:first-child{color:var(--accent);font-weight:700;width:90px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:520px){ .who{text-align:left} .logo{height:38px} }
</style>

 "title": "Nastavte vlastné inštrukcie a pamäť", "why": "Vlastné inštrukcie napíšete raz a ChatGPT ich použije v každom chate. Pamäť si zapamätá informácie z rozhovorov. Je dobré vedieť, čo v nej je.", "steps": ["Kliknite na svoje meno vľavo dole a otvorte Nastavenia, časť Personalizácia.", "Do poľa o vás vložte text „O mne“, do poľa o štýle odpovedí text „Ako odpovedať“.", "Otvorte správu pamäte a prejdite uložené informácie. Vymažte, čo nesedí alebo je citlivé.", "V novom chate vložte kontrolný prompt a overte, čo si ChatGPT o vás pamätá."], "prompts": [["O mne", "Vediem eventovú divíziu KORA Events & Marketing v Trenčíne, ktorá je súčasťou KORA a.s. Pripravujem firemné podujatia, interné eventy a marketingové aktivity. Pracujem s klientmi, dodávateľmi (catering, technika, priestory) a s kolegom. [Doplňte, čo by mal ChatGPT ešte vedieť.]"], ["Ako odpovedať", "Píš po slovensky, vecne a stručne.\nVýstupy, ktoré sa dajú dať do tabuľky, daj do tabuľky.\nKeď ti chýba dôležitá informácia, najprv sa opýtaj.\nČísla, ceny a kapacity nevymýšľaj. Ak odhaduješ, napíš to."], ["Kontrola pamäte", "Čo si o mne pamätáš? Vypíš to v bodoch."]], "tip": "Ak pracujete pre viacerých klientov, nechajte pamäť zapnutú a každého väčšieho klienta alebo event držte v samostatnom projekte s pamäťou len pre projekt."}, {"id": "6", "title": "Projekt alebo agent?", "why": "Na opakovanú prácu máte v ChatGPT Business viac možností (prehľad je v úvode, časť Spôsoby práce). Vlastné GPT plánuje OpenAI ukončiť, preto asistentov staviame ako projekty a agentov.", "table": {"head": ["", "Projekt", "Agent"], "rows": [["Na čo", "Pracovný priestor pre klienta alebo event", "Nastavený postup pre tím"], ["Obsahuje", "Inštrukcie, súbory, históriu chatov", "Inštrukcie, súbory, schopnosti, pripojené aplikácie"], ["Príklad", "Event pre klienta X od briefu po report", "Každý pondelok prehľad úloh na eventy v týždni"], ["Zdieľanie", "S členmi workspace", "Súkromne, cez odkaz alebo v adresári priestoru"], ["Kto ho v <script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const MODE = D.mode, TOTAL = D.meta.total;
const view = document.getElementById('view'), tabs = document.getElementById('tabs');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nb = s => esc(s).replace(/(?<=^|[\s(„])([aiouvkszAIOUVKSZ]) /g, '$1 ');
const K = 'kora-' + MODE + '-';
/* Adresa Google Apps Script, ktorý pošle poznámky e-mailom Rasťovi. Prázdne = len kopírovanie. */
const NOTES_ENDPOINT = '';
const store = {
  get(k){ try{ return localStorage.getItem(K+k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(K+k,v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(K+k) }catch(e){} }
};

function bar(m){ return `<span class="bar"><i style="width:${Math.round(m/25*100)}%"></i></span>` }
function checklist(items,key){
  return `<ul class="check">${items.map((x,i)=>{
    const m = /^(.*?:)\s*_+\s*$/.exec(x);
    if(m) return `<li><label><input type="checkbox" id="${key}-${i}" data-check="${key}-${i}" data-other="${key}-${i}-t"><span class="other"><span>${nb(m[1])}</span><input type="text" id="${key}-${i}-t" data-key="${key}-${i}-t" data-label="${esc(m[1])}" placeholder="doplňte" aria-label="${esc(m[1])}"></span></label></li>`;
    return `<li><label><input type="checkbox" id="${key}-${i}" data-check="${key}-${i}"><span>${nb(x)}</span></label></li>`;
  }).join('')}</ul>`;
}
function fill(label,lines,key){
  return `<div class="fill"><label for="${key}">${nb(label)}</label><textarea id="${key}" data-key="${key}" data-label="${esc(label)}" rows="${Math.max(2,lines+1)}" placeholder="Sem si píšte poznámky"></textarea></div>`;
}
function promptHTML(label,text,key){
  const body = esc(text).replace(/\[[^\]]+\]/g, m => `<mark>${m}</mark>`);
  return `<figure class="prompt"><figcaption><span>${nb(label)}</span><button type="button" class="copy" data-copy="${key}">Kopírovať</button></figcaption><pre id="${key}">${body}</pre></figure>`;
}
function tableHTML(t,key){
  const head = `<tr>${t.head.map(h=>`<th>${nb(h)}</th>`).join('')}</tr>`;
  const rows = t.rows.map((r,ri)=>`<tr>${r.map((c,ci)=> c==='' && ci>0
      ? `<td><textarea id="${key}-c${ri}" data-key="${key}-c${ri}" data-label="${esc(r[0])}" rows="2" aria-label="${esc(t.head[ci])}: ${esc(r[0])}"></textarea></td>`
      : `<td>${nb(c)}</td>`).join('')}</tr>`).join('');
  return `<div class="tbl"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}
function hero(s, eyebrow){
  return `<p class="eyebrow">${eyebrow}</p><h1>${nb(s.title)}</h1>
    <div class="meta"><span><b>Termín:</b> ${esc(s.date)}</span><span><b>Rozsah:</b> ${esc(s.duration)}</span>${s.place?`<span><b>Forma:</b> ${nb(s.place)}</span>`:''}</div>`;
}
function pending(s){
  const txt = MODE==='lektor' ? 'Scenár doplníme podľa tempa po predchádzajúcom sedení.' : 'Pracovný list doplníme pred sedením.';
  return hero(s, `Sedenie ${s.n} z ${TOTAL} · pripravujeme`) +
    `<div class="pending"><p class="lab">Čo nás čaká</p><p>${nb(s.teaser)}</p><p class="small" style="margin:0">${txt}</p></div>`;
}

/* ---------- úvod / všeobecné sekcie ---------- */
function sec(x,key){
  let h = `<section class="task" id="${key}"><header>${x.eb?`<p class="eyebrow">${nb(x.eb)}</p>`:''}<h2>${nb(x.title)}</h2></header>`;
  if(x.text) h += `<p class="why">${nb(x.text)}</p>`;
  if(x.bullets) h += `<ul>${x.bullets.map(b=>`<li>${nb(b)}</li>`).join('')}</ul>`;
  if(x.ordered) h += `<ol class="steps">${x.ordered.map(b=>`<li>${nb(b)}</li>`).join('')}</ol>`;
  if(x.cols) h += `<div class="cols">${x.cols.map(c=>`<div class="card"><h4>${nb(c.title)}</h4><ul>${c.items.map(i=>`<li>${nb(i)}</li>`).join('')}</ul></div>`).join('')}</div>`;
  if(x.table) h += tableHTML(x.table, key);
  if(x.prompts) h += `<div class="prompts">${x.prompts.map((p,i)=>promptHTML(p[0],p[1],`${key}-p${i}`)).join('')}</div>`;
  if(x.note) h += `<p class="tip"><b>Pozor</b>${nb(x.note)}</p>`;
  if(x.tip) h += `<p class="tip"><b>Pre vás</b>${nb(x.tip)}</p>`;
  if(x.text_after) h += `<p style="margin-top:12px">${nb(x.text_after)}</p>`;
  if(x.check) h += checklist(x.check, `${key}-ch`);
  if(x.fills) h += x.fills.map((f,i)=>fill(f[0],f[1],`${key}-f${i}`)).join('');
  if(x.src) h += `<p class="src">Zdroj: ${nb(x.src)}</p>`;
  return h + `</section>`;
}
function introHero(s, eyebrow){
  return `<p class="eyebrow">${eyebrow}</p><h1>${nb(s.title)}</h1>
    <div class="meta"><span><b>Kedy:</b> ${esc(s.date)}</span><span><b>Rozsah:</b> ${esc(s.duration)}</span></div>`;
}
function introClient(s){
  let h = introHero(s, 'Úvod · ChatGPT Business pre KORA Events') + `<p class="why" style="font-size:16px">${nb(s.lead)}</p>`;
  h += `<ul class="how"><li>Polia na vyplnenie si vyplňte ešte pred sedením 1.</li><li>Vzor zadania na konci si môžete skopírovať.</li></ul>`;
  s.sections.forEach((x,i)=> h += sec(x, `s0-x${i}`));
  h += `<section class="end"><h2 style="margin-bottom:8px">Zdroje</h2><ul class="srcs">${s.sources.map(r=>`<li><a href="${esc(r[1])}" target="_blank" rel="noopener">${nb(r[0])}</a></li>`).join('')}</ul><p class="small" style="margin-top:8px">${nb(s.sources_note)}</p>
        <div class="next"><span>Ďalej: <b>Sedenie 1 · Porozumenie ChatGPT</b></span><a class="ghost" href="#sedenie-1" style="text-decoration:none">Otvoriť sedenie 1</a></div>
        ${notesBlock(s.n)}</section>`;
  return h;
}
function introLektor(s){
  let h = introHero(s, 'Úvod · lektorské poznámky');
  s.lektor.sections.forEach((x,i)=> h += sec(x, `s0-l${i}`));
  return h;
}

/* ---------- pracovný list ---------- */
function task(s,t){
  const id = `s${s.n}-t${t.id}`;
  let h = `<section class="task" id="${id}"><header><p class="eyebrow">Úloha ${esc(t.id)}</p><h2>${nb(t.title)}</h2></header><p class="why">${nb(t.why)}</p>`;
  if(t.facts) h += `<h3>Čo vedieť</h3><ul>${t.facts.map(x=>`<li>${nb(x)}</li>`).join('')}</ul>`;
  if(t.table) h += tableHTML(t.table, id);
  if(t.steps) h += `<h3>Postup</h3><ol class="steps">${t.steps.map(x=>`<li>${nb(x)}</li>`).join('')}</ol>`;
  if(t.prompts) h += `<div class="prompts">${t.prompts.map((p,i)=>promptHTML(p[0],p[1],`${id}-p${i}`)).join('')}</div>`;
  if(t.list) h += `<h3>${nb(t.list_title)}</h3><ol class="rules">${t.list.map(x=>`<li>${nb(x)}</li>`).join('')}</ol>`;
  if(t.tip) h += `<p class="tip"><b>Tip</b>${nb(t.tip)}</p>`;
  if(t.choice) h += `<h3>${nb(t.choice.title)}</h3><ol class="choice">${t.choice.items.map((it,i)=>`<li><span>${nb(it)}</span><span class="opts">${t.choice.options.map(o=>`<label><input type="radio" name="${id}-q${i}" value="${esc(o)}" data-radio="${id}-q${i}">${esc(o)}</label>`).join('')}</span></li>`).join('')}</ol>`;
  if(t.fills) h += t.fills.map((f,i)=>fill(f[0],f[1],`${id}-f${i}`)).join('');
  if(t.checks) h += `<h3>${nb(t.checks.title)}</h3>` + checklist(t.checks.items, `${id}-ch`);
  return h + `</section>`;
}
function notesBlock(n){
  return `<div class="notes-box"><h2>Uložte si poznámky</h2>
    <p>Tlačidlo skopíruje všetky vaše poznámky. Vložte si ich (Ctrl + V) do vlastného dokumentu. Ak chcete, pošlite ich Rasťovi e-mailom. Po skopírovaní sa poznámky z tejto stránky vymažú.</p>
    <button type="button" class="copy big" data-notes="${n}">Skopírovať poznámky</button>
    <p class="notes-msg" id="notes-msg-${n}" role="status"></p>
    <textarea class="notes-out" id="notes-out-${n}" rows="8" readonly hidden></textarea></div>`;
}
function client(s){
  if(s.type==='intro') return introClient(s);
  if(s.status !== 'ready') return pending(s);
  let h = hero(s, `Sedenie ${s.n} z ${TOTAL} · pracovný list`);
  h += `<section class="overview"><div class="card tint"><p class="lab">Cieľ sedenia</p><p>${nb(s.goal)}</p></div>
        <div class="card"><p class="lab">Čo budete mať na konci</p>${checklist(s.outputs, `s${s.n}-out`)}</div></section>`;
  h += `<ul class="how">${s.how.map(x=>`<li>${nb(x)}</li>`).join('')}</ul>`;
  if(s.info) h += `<div class="info"><h2>${nb(s.info.title)}</h2><p style="margin:0">${nb(s.info.text)}</p></div>`;
  s.tasks.forEach(t => h += task(s,t));
  if(s.others) h += `<section class="task"><header><p class="eyebrow">Na okraj</p><h2>${nb(s.others.title.replace(/^Na okraj: /,''))}</h2></header><p class="why">${nb(s.others.text)}</p>${tableHTML({head:['Nástroj','Kedy by dával zmysel'],rows:s.others.rows}, `s${s.n}-oth`)}</section>`;
  h += `<section class="end"><p class="eyebrow">Do ďalšieho sedenia</p><h2>Domáca úloha</h2><p class="small">Časová náročnosť ${esc(s.homework_time)}</p>${checklist(s.homework, `s${s.n}-hw`)}
        ${fill('Moje otázky na ďalšie sedenie:', 3, `s${s.n}-q`)}
        <div class="next"><span>Ďalej: <b>${nb(s.next)}</b></span></div>
        ${notesBlock(s.n)}</section>`;
  return h;
}

/* ---------- lektorský scenár ---------- */
function lektor(s){
  if(s.type==='intro') return introLektor(s);
  if(s.status !== 'ready' || !s.lektor) return pending(s);
  const L = s.lektor, k = `s${s.n}`;
  let h = hero(s, `Sedenie ${s.n} z ${TOTAL} · lektorský scenár`);
  h += `<section class="overview"><div class="card tint"><p class="lab">Cieľ sedenia</p><p>${nb(s.goal)}</p></div>
        <div class="card"><p class="lab">Výstupy pre klientku</p><ul>${s.outputs.map(x=>`<li>${nb(x)}</li>`).join('')}</ul></div></section>`;
  const total = L.blocks.reduce((a,b)=>a+b.min,0);
  h += `<h2 style="margin:28px 0 4px">Časový plán</h2><div class="tbl"><table class="agenda"><thead><tr><th>Čas</th><th>Min</th><th>Blok</th><th>Pracovný list</th></tr></thead><tbody>
        ${L.blocks.map(b=>`<tr${b.pause?' class="pause"':''}><td class="tm">${esc(b.time)}</td><td class="mn">${b.min}${bar(b.min)}</td><td class="bl">${b.pause?'':esc(b.n)+' '}${nb(b.t)}</td><td>${b.pl?nb(b.pl):''}</td></tr>`).join('')}
        </tbody><tfoot><tr><td></td><td>${total}</td><td colspan="2">Spolu ${Math.round(total/60)} hodiny vrátane prestávky</td></tr></tfoot></table></div>`;
  h += `<h2 style="margin:28px 0 8px">Príprava pred sedením</h2>` + checklist(L.prep, `${k}-prep`);
  L.blocks.filter(b=>!b.pause).forEach(b=>{
    h += `<article class="blk"><header><span class="bn">${esc(b.n)}</span><h2>${nb(b.t)}</h2><span class="bt">${esc(b.time)} · ${b.min} min</span>${b.pl?`<span class="chip">Pracovný list: ${nb(b.pl)}</span>`:''}</header>
      <blockquote><small>Kľúčová veta</small>„${nb(b.key)}“</blockquote>
      <h3>Postup</h3><ol class="steps">${b.steps.map(x=>`<li>${nb(x)}</li>`).join('')}</ol>
      ${b.qa && b.qa.length ? `<h3>Otázky, ktoré môžu prísť</h3><dl>${b.qa.map(q=>`<dt>${nb(q[0])}</dt><dd>${nb(q[1])}</dd>`).join('')}</dl>`:''}
      ${b.short ? `<p class="short"><b>Ak nestíhaš:</b> ${nb(b.short)}</p>`:''}</article>`;
  });
  h += `<section class="end"><h2 style="margin-bottom:8px">Na čo dať pozor</h2><div class="tbl"><table class="risk"><tbody>${L.risks.map(r=>`<tr><td>${nb(r[0])}</td><td>${nb(r[1])}</td></tr>`).join('')}</tbody></table></div>
        <h2 style="margin:24px 0 8px">Po sedení</h2>${checklist(L.after, `${k}-after`)}
        ${fill('Moje poznámky k tempu a úpravám pre ďalšie sedenia:', 4, `${k}-notes`)}</section>`;
  return h;
}

/* ---------- navigácia a stav ---------- */
function bind(){
  view.querySelectorAll('[data-key]').forEach(el=>{
    const v = store.get(el.dataset.key); if(v !== null) el.value = v;
    el.addEventListener('input', ()=>{
      store.set(el.dataset.key, el.value);
      const cb = view.querySelector(`[data-other="${el.dataset.key}"]`);
      if(cb && el.value.trim() && !cb.checked){ cb.checked = true; store.set(cb.dataset.check,'1'); }
    });
  });
  view.querySelectorAll('[data-check]').forEach(el=>{
    el.checked = store.get(el.dataset.check) === '1';
    el.addEventListener('change', ()=>store.set(el.dataset.check, el.checked?'1':'0'));
  });
  view.querySelectorAll('[data-radio]').forEach(el=>{
    el.checked = store.get(el.dataset.radio) === el.value;
    el.addEventListener('change', ()=>{ if(el.checked) store.set(el.dataset.radio, el.value) });
  });
}
async function copyText(text, btn, fallbackEl, okLabel){
  const orig = btn.textContent;
  try{ await navigator.clipboard.writeText(text); btn.textContent = okLabel || 'Skopírované'; btn.classList.add('done'); }
  catch(e){
    if(fallbackEl){
      if(fallbackEl.tagName === 'TEXTAREA'){ fallbackEl.hidden = false; fallbackEl.value = text; fallbackEl.select(); }
      else { const r = document.createRange(); r.selectNodeContents(fallbackEl); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    }
    btn.textContent = 'Označené, stlačte Ctrl+C';
  }
  setTimeout(()=>{ btn.textContent = orig; btn.classList.remove('done') }, 1800);
}
view.addEventListener('click', e=>{
  const c = e.target.closest('[data-copy]');
  if(c){ const pre = document.getElementById(c.dataset.copy); copyText(pre.textContent, c, pre); return; }
  const n = e.target.closest('[data-notes]');
  if(n) sendNotes(n);
});
function collectNotes(){
  const sess = D.sessions.find(x=>x.n===current) || {};
  const head = (sess.type==='intro' ? 'Úvod' : 'Sedenie ' + sess.n) + ' · ' + (sess.title||'');
  const parts = [];
  view.querySelectorAll('section').forEach(sec=>{
    const h = sec.querySelector('h2') || sec.querySelector('.lab'); const lines = [];
    sec.querySelectorAll('textarea[data-key], input[type=text][data-key]').forEach(t=>{ if(t.closest('.check')) return; if(t.value.trim()) lines.push(t.dataset.label + '\n' + t.value.trim()); });
    sec.querySelectorAll('.check').forEach(ul=>{
      const on = [...ul.querySelectorAll('input[type=checkbox]:checked')].map(c=>{ const lab=c.closest('label'); const t=lab.querySelector('input[type=text]'); return t ? (lab.innerText.trim() + ' ' + t.value.trim()).trim() : lab.innerText.trim(); }).filter(Boolean);
      if(on.length) lines.push('Zaškrtnuté: ' + on.join(', '));
    });
    sec.querySelectorAll('.choice li').forEach((li,i)=>{
      const r = li.querySelector('input[type=radio]:checked');
      if(r) lines.push((i+1) + '. ' + li.querySelector('span').innerText.trim() + ' → ' + r.value);
    });
    if(lines.length) parts.push('## ' + (h ? h.innerText.trim() : '') + '\n' + lines.join('\n\n'));
  });
  return { head, text: parts.length ? head + '\n\n' + parts.join('\n\n') : '' };
}
async function sendNotes(btn){
  const out = document.getElementById('notes-out-' + btn.dataset.notes);
  const msg = document.getElementById('notes-msg-' + btn.dataset.notes);
  const {head, text} = collectNotes();
  if(!text){ msg.textContent = 'Zatiaľ nemáte vyplnené žiadne poznámky.'; return; }
  btn.disabled = true;
  let sent = false;
  if(NOTES_ENDPOINT){
    try{
      await fetch(NOTES_ENDPOINT, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({subject:'Poznámky KORA · ' + head, text})});
      sent = true;
    }catch(e){ sent = false; }
  }
  let copied = false;
  try{ await navigator.clipboard.writeText(text); copied = true; }catch(e){}
  if(!copied){ out.hidden = false; out.value = text; out.select(); }
  if(NOTES_ENDPOINT && !sent){
    msg.textContent = 'Poznámky sa nepodarilo odoslať. Skontrolujte pripojenie a skúste to znova. Na stránke zostali.';
    if(!copied){ out.hidden = false; }
    btn.disabled = false; return;
  }
  view.querySelectorAll('textarea[data-key], input[type=text][data-key]').forEach(t=>{ t.value=''; store.del(t.dataset.key); });
  const parts = [];
  if(sent) parts.push('Poznámky sme poslali Rasťovi.');
  parts.push(copied ? 'Sú skopírované, vložte si ich (Ctrl + V) do vlastného dokumentu.' : 'Text nižšie je označený, stlačte Ctrl + C a vložte si ho do vlastného dokumentu. Po zatvorení stránky zmizne.');
  msg.textContent = parts.join(' ');
  btn.disabled = false;
}
let current = 0;
function route(){
  const m = /^#sedenie-(\d)$/.exec(location.hash);
  let n = m ? +m[1] : (location.hash==='#uvod' ? 0 : (MODE==='client' ? 0 : 1));
  const s = D.sessions.find(x=>x.n===n) || D.sessions[0];
  current = s.n;
  tabs.innerHTML = D.sessions.map(x=> x.type==='intro'
    ? `<a href="#uvod" class="${x.n===s.n?'on':''}" ${x.n===s.n?'aria-current="page"':''}><b>Úvod</b><span>ChatGPT Business</span></a>`
    : `<a href="#sedenie-${x.n}" class="${x.n===s.n?'on':''} ${x.status!=='ready'?'pend':''}" ${x.n===s.n?'aria-current="page"':''}><b>Sedenie ${x.n}</b><span>${esc(x.title.length>26?x.title.slice(0,24)+'…':x.title)}</span></a>`).join('');
  view.innerHTML = MODE==='lektor' ? lektor(s) : client(s);
  bind();
}
window.addEventListener('hashchange', ()=>{ route(); window.scrollTo(0,0); });
route();
})();
</script>
